

limit_req_zone $binary_remote_addr zone=bocc_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bocc_api:10m rate=60r/m;

.
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Uncomment after certbot has provisioned certificates:
    # return 301 https://$host$request_uri;

    # --- Everything below runs on plain HTTP until you enable HTTPS above ---

    root /var/www/bocc/Frontend/dist;
    index index.html;

    client_max_body_size 5m;

    # Security headers (helmet already sets most of these app-side for API
    # responses; these cover the static frontend too).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # --- API reverse proxy ---
    location /api/ {
        limit_req zone=bocc_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tighter edge rate limit specifically on the auth endpoints
    location /api/auth/ {
        limit_req zone=bocc_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:5000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Socket.IO (websocket upgrade) ---
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # keep long-lived websocket connections open
    }

    # --- React Router SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; index.html is never cached
    # (above) so new deploys are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
