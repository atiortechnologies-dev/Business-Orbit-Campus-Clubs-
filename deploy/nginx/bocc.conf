# ═══════════════════════════════════════════════════════════════════════════════
# BOCC (Business Orbit Campus Clubs) — Nginx Configuration
# SSL is handled by the hosting provider's Caddy proxy.
# Nginx handles routing on port 80 based on Host header.
#
# DOMAIN:
#   businessorbit.org / www.businessorbit.org → Frontend SPA + API proxy
#
# Backend runs on port 5000 (PM2 cluster mode)
# ═══════════════════════════════════════════════════════════════════════════════

# Rate limiting zones (separate from janki zones)
limit_req_zone $binary_remote_addr zone=bocc_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bocc_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bocc_general:10m rate=50r/s;

# ── Frontend + API: businessorbit.org ────────────────────────────────────────
server {
    listen 80;
    server_name businessorbit.org www.businessorbit.org;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/xml+rss image/svg+xml;
    gzip_comp_level 6;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Socket.IO websocket proxy ────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # ── Auth endpoints (tighter rate limit) ──────────────────────────────────
    location /api/auth/ {
        limit_req zone=bocc_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    # ── API reverse proxy ────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=bocc_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
    }

    # ── Frontend SPA ─────────────────────────────────────────────────────────
    location / {
        limit_req zone=bocc_general burst=50 nodelay;
        root /var/www/bocc/Frontend/dist;
        try_files $uri $uri/ /index.html;

        # Cache hashed static assets aggressively
        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}
